# Visit https://github.com/lowlighter/metrics#-documentation for full reference
name: Metrics
on:
  schedule: [{cron: "0 */3 * * *"}] # Run every 3 hours
  workflow_dispatch:              # Allows manual execution
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-update
      cancel-in-progress: true
    steps:
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: ${{ runner.os }}-cache-${{ hashFiles('**/lockfiles') }}
      - name: Generate Change-Id
        id: change_id
        run: |
          CID="I$(openssl rand -hex 20)"
          echo "cid=${CID}" >> $GITHUB_OUTPUT
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT }}
          committer_message: |
            chore: update metrics
            
            Change-Id: ${{ steps.change_id.outputs.cid }}

          # Options
          user: tanvirr007
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Dhaka
          plugin_gists: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_traffic: yes
          plugin_languages: yes
          plugin_languages_colormap: github
          plugin_languages_details: percentage
          plugin_languages_limit: 8

